<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | SkillSync</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="ui-wrapper" style="max-width: 420px; margin: auto;">
        <div class="main-card">
            <div style="text-align: center; margin-bottom: 25px;">
                <div style="background: rgba(79, 70, 229, 0.1); width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; color: #4f46e5; font-size: 24px;">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h2 style="margin: 0; font-weight: 800;">Create Account</h2>
                <p style="color: #64748b; font-size: 14px; margin-top: 5px;">Join the AI-driven skill assessment platform.</p>
            </div>

            <form action="/signup" method="POST">
                <div class="input-group">
                    <label><i class="fas fa-user"></i> Full Name</label>
                    <input type="text" name="name" required placeholder="Enter your full name">
                </div>

                <div class="input-group">
                    <label><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" name="email" required placeholder="name@company.com">
                </div>

                <div class="input-group">
                    <label><i class="fas fa-user-tag"></i> Select Role</label>
                    <select name="role" required style="width: 100%; padding: 12px 14px; border: 2px solid #e2e8f0; border-radius: 12px; background: #f8fafc; font-family: inherit; font-size: 14px; outline: none; appearance: none;">
                        <option value="" disabled selected>Choose your role...</option>
                        <option value="student">Student / Candidate</option>
                        <option value="mentor">Mentor / Recruiter</option>
                    </select>
                </div>

                <div class="input-group" style="position: relative;">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" name="password" id="passwordField" required placeholder="Enter password">
                <i class="fas fa-eye" id="togglePassword" 
                style="position: absolute; right: 15px; top: 40px; cursor: pointer; color: #64748b;"></i>
            </div>

                <button type="submit" class="btn" style="justify-content: center; width: 100%; margin-top: 10px;">
                    Create Account <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div style="margin-top: 25px; text-align: center; font-size: 14px; color: #64748b;">
                Already have an account? 
                <a href="/login" style="color: #4f46e5; font-weight: 700; text-decoration: none; margin-left: 5px;">Log In</a>
            </div>
        </div>
    </div>
    <script>
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#passwordField');

    togglePassword.addEventListener('click', function (e) {
        // Toggle the type attribute
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        // Toggle the eye / eye-slash icon
        this.classList.toggle('fa-eye-slash');
    });
</script>
</body>
</html>
