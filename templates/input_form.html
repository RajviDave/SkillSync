<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Setup - SkillSync</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <style>
        .assessment-card {
            background: var(--white);
            padding: 3rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 600px; /* Wider than login card */
            position: relative;
            overflow: hidden;
            margin: 20px; /* Space on mobile */
        }
        /* Top Bar Accent */
        .assessment-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        .spinner {
            width: 50px; height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="assessment-card">
        
        <div style="text-align: center; margin-bottom: 30px;">
            <div class="brand-logo">
                <i class="fas fa-rocket"></i>
            </div>
            <h2>New Assessment</h2>
            <p class="subtitle">Fill in the details to generate your quiz</p>
        </div>

        <form method="POST" action="/analyze" enctype="multipart/form-data">
            
            <div class="input-group">
                <label>Job Description (JD)</label>
                <textarea name="jd" placeholder="Paste the full job description here..." required></textarea>
                <i class="fas fa-briefcase"></i>
            </div>

            <label style="font-weight:600; font-size:0.9rem; color:var(--accent); display:block; margin-bottom:8px;">Upload Resume (PDF)</label>
            <div class="file-upload-wrapper">
                <input name="resume" type="file" accept="application/pdf" required>
            </div>

            <div class="input-group">
                <label>Mentor's Feedback</label>
                <textarea name="comments" placeholder="Any specific areas to focus on?" rows="2"></textarea>
                <i class="fas fa-comment-dots"></i>
            </div>

            <div class="input-group">
                <label>GitHub Username</label>
                <input name="git" type="text" placeholder="e.g. octocat">
                <i class="fab fa-github"></i>
            </div>

            <button type="submit" class="btn">
                <i class="fas fa-magic" style="margin-right: 8px;"></i> Start Analysis
            </button>

        </form>
    </div>

        <div id="loading-overlay" style="display:none; text-align:center; padding: 50px;">
        <div class="spinner"></div>
        <h2 id="loading-text">Analyzing your profile...</h2>
        <p>This may take a few seconds.</p>
    </div>

    <script>
        window.onpageshow = function(event) {
            if (event.persisted) window.location.reload();
        };
    </script>

    <script>
    document.querySelector('form').onsubmit = function() {
        // Hide the form
        this.style.display = 'none';
        // Show the loader
        document.getElementById('loading-overlay').style.display = 'block';
        
        // Change text every 2 seconds to look "smart"
        const phrases = ["Parsing Resume...", "Scanning GitHub Repos...", "Checking Domain Match..."];
        let i = 0;
        setInterval(() => {
            document.getElementById('loading-text').innerText = phrases[i % phrases.length];
            i++;
        }, 2000);
    };
    </script>

</body>
</html>
