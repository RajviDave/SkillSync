<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SkillSync</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="login-card">
        <div class="brand-logo">
            <i class="fas fa-layer-group"></i> </div>

        <h2>Welcome Back</h2>
        <p class="subtitle">Enter your details to access your account</p>
        
        <form action="/login" method="POST">
            
            <div class="input-group">
                <input type="email" name="email" placeholder="Email Address" required>
                <i class="fas fa-envelope"></i>
            </div>

            <div class="input-group" style="position: relative;">
            <label><i class="fas fa-lock"></i> Password</label>
            <input type="password" name="password" id="passwordField" required placeholder="Enter password">
            <i class="fas fa-eye" id="togglePassword" 
            style="position: absolute; right: 15px; top: 40px; cursor: pointer; color: #64748b;"></i>
        </div>

            <button type="submit" class="btn">Sign In</button>
        </form>
        <div style="text-align: right; margin-top: -10px; margin-bottom: 15px;">
        
        </div>
        
        <div class="links">
            <p>Don't have an account? <a href="/signup">Sign Up</a></p>
        </div>
    </div>

    <script>
        window.onpageshow = function(event) {
            if (event.persisted) window.location.reload();
        };
    </script>

    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#passwordField');

        togglePassword.addEventListener('click', function (e) {
            // Toggle the type attribute
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            // Toggle the eye / eye-slash icon
            this.classList.toggle('fa-eye-slash');
});
    </script>

    </body>

</body>
</html>
